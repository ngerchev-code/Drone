name: Build

on:
  push:
    paths: ['android/**', 'tracker/**', 'encyclopedia/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Node тестове (tracker + encyclopedia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: tracker
      - run: npm test
        working-directory: encyclopedia
      - name: NASA GIBS и български RSS (диагностика)
        continue-on-error: true
        run: |
          for d in $(date -u -d yesterday +%F) $(date -u -d '2 days ago' +%F); do
            for l in VIIRS_NOAA20_CorrectedReflectance_TrueColor VIIRS_NOAA21_CorrectedReflectance_TrueColor VIIRS_SNPP_CorrectedReflectance_TrueColor MODIS_Aqua_CorrectedReflectance_TrueColor MODIS_Terra_CorrectedReflectance_TrueColor; do
              printf '%s %s -> ' "$d" "$l"; curl -s -o /dev/null -w '%{http_code} %{size_download}\n' "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/$l/default/$d/GoogleMapsCompatible_Level9/6/22/36.jpg"
            done
          done
          for u in https://www.dnevnik.bg/rss/ https://www.mediapool.bg/rss.xml https://offnews.bg/rss/all https://www.capital.bg/rss/ https://btvnovinite.bg/rss https://bntnews.bg/bg/rss https://www.24chasa.bg/rss https://www.novinite.com/services/news_rdf.php https://www.segabg.com/rss.xml https://defence-industry.eu/feed/ https://bulgarianmilitary.com/feed/ https://www.bta.bg/bg/rss; do
            printf '%s -> ' "$u"; curl -sL -o /tmp/f -w '%{http_code} %{content_type} %{size_download} ' -A 'Mozilla/5.0 (Android 14) DroneRadar' "$u"; grep -a -o -c '<item' /tmp/f || true
          done
      - name: Картни източници без ключ (диагностика)
        continue-on-error: true
        run: |
          for u in \
            https://tiles.openfreemap.org/styles/dark \
            https://tiles.openfreemap.org/styles/positron \
            https://tiles.openfreemap.org/styles/liberty \
            https://tiles.openfreemap.org/styles/fiord \
            https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/3/2/4 \
            https://tile.openstreetmap.org/3/4/2.png \
            https://basemaps.cartocdn.com/dark_all/3/4/2.png \
            https://demotiles.maplibre.org/style.json \
            https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2023_3857/default/g/6/22/36.jpg \
            "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/$(date -u -d yesterday +%F)/GoogleMapsCompatible_Level9/6/22/36.jpg" \
            "https://news.google.com/rss/search?q=%D0%B4%D1%80%D0%BE%D0%BD%D0%BE%D0%B2%D0%B5&hl=bg&gl=BG&ceid=BG:bg"; do
            printf '%s -> ' "$u"; curl -s -o /tmp/t -w '%{http_code} %{content_type} %{size_download}\n' -A 'DroneRadar-CI' "$u"
            head -c 160 /tmp/t | tr -d '\n' | grep -a -o '"name":"[^"]*"' || true
          done

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: core тестове (Remote ID, ADS-B, SondeHub, парсери)
        run: ./gradlew -p core test --console=plain
      - name: Живи данни (ADS-B, SondeHub, новини)
        continue-on-error: true
        env:
          LIVE: '1'
        run: ./gradlew -p core test --tests '*Live*' --rerun-tasks --console=plain
      - name: Сглобяване на APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: droneradar-receiver-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-ui:
    name: UI тест в емулатор
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: droneradar-receiver-debug
          path: apk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow (за скрийншотите)
        run: pip install --quiet pillow
      - name: Включване на KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Емулатор + демо режим + скрийншоти
        id: ui1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/ui-smoke.sh apk/app-debug.apk
      - name: Втори опит (при срив на инфраструктурата, напр. сваляне на образа)
        if: steps.ui1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/ui-smoke.sh apk/app-debug.apk

  release:
    name: Публикуване на APK (Releases)
    needs: [android, android-ui]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: droneradar-receiver-debug
          path: apk
      - run: mv apk/app-debug.apk apk/DroneRadar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: droneradar-v0.5.${{ github.run_number }}
          name: DroneRadar 0.5 (сглобяване ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: apk/DroneRadar.apk
          body: |
            Android приложение DroneRadar: жива карта на безпилотните апарати.
            Инсталиране: свали DroneRadar.apk на телефона (Android 8.0+) и го отвори.
            Прототип, подписан с тестов (debug) ключ. Проверен в емулатор (Android 13).
