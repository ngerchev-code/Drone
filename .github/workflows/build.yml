name: Build

on:
  push:
    paths: ['android/**', 'tracker/**', 'encyclopedia/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Node тестове (tracker + encyclopedia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: tracker
      - run: npm test
        working-directory: encyclopedia

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: core тестове (Remote ID, ADS-B, SondeHub, парсери)
        run: ./gradlew -p core test --console=plain
      - name: Живи данни (ADS-B, SondeHub, новини)
        continue-on-error: true
        env:
          LIVE: '1'
        run: ./gradlew -p core test --tests '*Live*' --rerun-tasks --console=plain
      - name: Сглобяване на APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace
      - name: Подпис на APK (трябва да е един и същ във всяко сглобяване)
        run: $(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: droneradar-receiver-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-ui:
    name: UI тест в емулатор
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: droneradar-receiver-debug
          path: apk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow (за скрийншотите)
        run: pip install --quiet pillow
      - name: Включване на KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Емулатор + демо режим + скрийншоти
        id: ui1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/ui-smoke.sh apk/app-debug.apk
      - name: Втори опит (при срив на инфраструктурата, напр. сваляне на образа)
        if: steps.ui1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/ui-smoke.sh apk/app-debug.apk

  release:
    name: Публикуване на APK (Releases)
    needs: [android, android-ui]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: droneradar-receiver-debug
          path: apk
      - run: mv apk/app-debug.apk apk/DroneRadar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: droneradar-v0.8.${{ github.run_number }}
          name: DroneRadar 0.8 (сглобяване ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: apk/DroneRadar.apk
          body: |
            Android приложение DroneRadar: жива карта на безпилотните апарати.
            Инсталиране: свали DroneRadar.apk на телефона (Android 8.0+) и го отвори.
            Прототип, подписан с постоянен ключ за разработка: новите версии се инсталират върху старите.
            Ако имаш версия от преди 0.8.1, първо я деинсталирай (тя е подписана с друг ключ).
            Проверен в емулатор (Android 13).
